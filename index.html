<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Hindi vocabulary list with English meanings and frequency ratings.">
  <title>Hindi Vocabulary</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23000000'/%3E%3Ctext x='50%25' y='54%25' text-anchor='middle' dominant-baseline='central' font-family='sans-serif' font-weight='bold' font-size='36' fill='%23ffffff'%3E%E0%A4%85%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* ---------- Design tokens ---------- */
    /* Light is the default theme */
    :root {
      /* Palette: pure black, pure white, and one grey */
      --bg: #ffffff;
      --surface: #ffffff;
      --panel: #e5e5e5;
      --ink: #000000;
      --muted: #000000;
      --line: #e5e5e5;
      --line-strong: #000000;
      --head: #000000;
      --head-ink: #ffffff;
      --accent: #000000;
      --meter-track: #e5e5e5;
      --meter-fill: #000000;
      --zebra: #ffffff;
      --hover: #e5e5e5;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.08);

      --font-ui: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-display: "Newsreader", Georgia, "Times New Roman", serif;
      --font-hi: "Noto Sans Devanagari", "Nirmala UI", "Mangal", "Lohit Devanagari", sans-serif;

      /* Theme switch */
      --switch-track: #e5e5e5;
      --switch-border: #000000;
      --switch-knob: #000000;
      --switch-knob-shadow: rgba(0, 0, 0, 0.25);
      --switch-icon: #ffffff;

      --radius: 14px;
      --title-h: 56px;
    }

    /* Dark theme, enabled only when the toggle sets data-theme="dark" */
    :root[data-theme="dark"] {
      --bg: #000000;
      --surface: #000000;
      --panel: #262626;
      --ink: #ffffff;
      --muted: #ffffff;
      --line: #262626;
      --line-strong: #ffffff;
      --head: #000000;
      --head-ink: #ffffff;
      --accent: #ffffff;
      --meter-track: #262626;
      --meter-fill: #ffffff;
      --zebra: #000000;
      --hover: #262626;
      --shadow: 0 1px 2px rgba(255, 255, 255, 0.06);

      --switch-track: #262626;
      --switch-border: #ffffff;
      --switch-knob: #ffffff;
      --switch-knob-shadow: rgba(255, 255, 255, 0.2);
      --switch-icon: #000000;
    }

    /* ---------- Base ---------- */
    *, *::before, *::after { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-ui);
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      padding: 0 0 max(32px, env(safe-area-inset-bottom));
    }

    .page {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      padding: 20px 12px 0;
    }

    @media (min-width: 640px) {
      .page { padding: 40px 24px 0; }
    }

    /* ---------- Table card ---------- */
    .vocab {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 0 0 var(--radius) var(--radius);
      box-shadow: var(--shadow);
    }

    /* Title bar: sticky at the top of the viewport */
    .vocab .title-row th {
      position: sticky;
      top: 0;
      z-index: 20;
      height: var(--title-h);
      padding: 0 20px;
      background: var(--head);
      color: var(--head-ink);
      border-radius: 0;
      font-family: var(--font-display);
      font-size: clamp(1.25rem, 1rem + 1vw, 1.5rem);
      font-weight: 600;
      letter-spacing: -0.01em;
      text-align: left;
    }

    .title-row .title-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .title-row .title-meta {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .title-row .count {
      font-family: var(--font-ui);
      font-size: 13px;
      font-weight: 500;
      color: color-mix(in srgb, var(--head-ink) 65%, transparent);
    }

    /* ---------- Theme switch ---------- */
    .theme-toggle {
      appearance: none;
      border: 0;
      padding: 0;
      background: none;
      cursor: pointer;
      border-radius: 999px;
      -webkit-tap-highlight-color: transparent;
    }

    .theme-toggle:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .switch-track {
      --w: 64px;
      --knob: 26px;
      --gap: 3px;
      --travel: calc(var(--w) - var(--knob) - var(--gap) * 2 - 2px);
      position: relative;
      display: block;
      width: var(--w);
      height: 32px;
      border-radius: 999px;
      background: var(--switch-track);
      border: 1px solid var(--switch-border);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.12);
      transition: background-color 0.4s ease, border-color 0.4s ease;
    }

    .theme-toggle:hover .switch-track {
      border-color: var(--switch-knob);
    }

    .switch-knob {
      position: absolute;
      top: 50%;
      left: var(--gap);
      width: var(--knob);
      height: var(--knob);
      margin-top: calc(var(--knob) / -2);
      border-radius: 50%;
      background: var(--switch-knob);
      box-shadow: 0 2px 8px var(--switch-knob-shadow);
      display: grid;
      place-items: center;
      transform: translateX(0);
      transition: transform 0.5s cubic-bezier(0.34, 1.4, 0.64, 1), background-color 0.4s ease, box-shadow 0.4s ease;
    }

    /* Slide the knob to the right in dark mode */
    :root[data-theme="dark"] .switch-knob {
      transform: translateX(var(--travel));
    }

    .theme-toggle:active .switch-knob {
      width: calc(var(--knob) + 4px);
    }

    /* Sun and moon swap inside the knob */
    .switch-knob svg {
      grid-area: 1 / 1;
      width: 15px;
      height: 15px;
      fill: none;
      stroke: var(--switch-icon);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: opacity 0.3s ease, transform 0.5s cubic-bezier(0.34, 1.4, 0.64, 1);
    }

    .switch-knob .icon-moon {
      opacity: 0;
      transform: rotate(-60deg) scale(0.6);
    }

    .switch-knob .icon-sun {
      opacity: 1;
      transform: rotate(0deg) scale(1);
    }

    :root[data-theme="dark"] .switch-knob .icon-sun {
      opacity: 0;
      transform: rotate(90deg) scale(0.6);
    }

    :root[data-theme="dark"] .switch-knob .icon-moon {
      opacity: 1;
      transform: rotate(0deg) scale(1);
    }

    @media (max-width: 479px) {
      .switch-track { --w: 56px; --knob: 22px; height: 28px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .switch-knob, .switch-knob svg, .switch-track { transition: none !important; }
    }

    /* Column header row: sticky beneath title bar (top set by JS) */
    .vocab .header-row th {
      position: sticky;
      top: var(--title-h);
      z-index: 10;
      padding: 12px 16px;
      background: var(--panel);
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      text-align: left;
      border-bottom: 1px solid var(--line-strong);
      white-space: nowrap;
    }

    th.col-no { width: 12%; text-align: center; }
    th.col-hi { width: 36%; }
    th.col-en { width: 34%; }
    th.col-rating { width: 18%; }

    /* Body cells */
    .vocab tbody td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
      transition: background-color 0.15s ease;
    }

    .vocab tbody tr:last-child td {
      border-bottom: none;
    }

    .vocab tbody tr:nth-child(even) td {
      background: var(--zebra);
    }

    .vocab tbody tr:hover td {
      background: var(--hover);
    }

    td.cell-no {
      text-align: center;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      font-size: 13px;
    }

    td.cell-hi {
      font-family: var(--font-hi);
      font-size: 17px;
      font-weight: 500;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    td.cell-en {
      color: var(--ink);
      overflow-wrap: anywhere;
    }

    /* Frequency rating: number plus a small meter */
    td.cell-rating {
      text-align: left;
    }

    .rating {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .rating-value {
      min-width: 28px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--ink);
    }

    .meter {
      position: relative;
      flex: 1;
      max-width: 96px;
      height: 6px;
      border-radius: 999px;
      background: var(--meter-track);
      overflow: hidden;
    }

    .meter-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: var(--v, 0%);
      border-radius: inherit;
      background: var(--meter-fill);
    }

    /* Status states */
    .status-msg td {
      padding: 40px 20px;
      text-align: center;
      color: var(--muted);
      border-bottom: none;
    }

    .status-msg.is-error td {
      color: var(--accent);
    }

    /* ---------- Small screens: tighten, keep same structure ---------- */
    @media (max-width: 479px) {
      .vocab .title-row th { padding: 0 14px; }
      .vocab .header-row th { padding: 10px 10px; font-size: 11px; }
      .vocab tbody td { padding: 10px 10px; }
      td.cell-hi { font-size: 16px; }
      td.cell-no { font-size: 12px; }
      .title-row .count { display: none; }
      .meter { max-width: 56px; }
      th.col-rating { width: 22%; }
    }

    /* ---------- Motion preferences ---------- */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
        animation: none !important;
      }
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
  </style>
</head>
<body>

  <main class="page">
    <table class="vocab" aria-describedby="vocab-caption">
      <thead>
        <tr class="title-row">
          <th colspan="4" scope="colgroup" id="mainTitle">
            <div class="title-inner">
              <span>Hindi Vocabulary</span>
              <div class="title-meta">
                <span class="count" id="vocabCount" aria-live="polite"></span>
                <button type="button" class="theme-toggle" id="themeToggle" aria-label="Switch to dark mode" aria-pressed="false" title="Switch to dark mode">
                  <span class="switch-track" aria-hidden="true">
                    <span class="switch-knob">
                      <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
                      <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                    </span>
                  </span>
                </button>
              </div>
            </div>
          </th>
        </tr>
        <tr class="header-row">
          <th scope="col" class="col-no">No</th>
          <th scope="col" class="col-hi">Hindi Word</th>
          <th scope="col" class="col-en">English Word</th>
          <th scope="col" class="col-rating">Freq. Rating</th>
        </tr>
      </thead>
      <tbody id="vocabBody">
        <tr class="status-msg">
          <td colspan="4">Loading vocabulary…</td>
        </tr>
      </tbody>
    </table>
  </main>

  <script>
    (() => {
      'use strict';

      // Frequency curve: one-minus-exponential model over rank 1..N
      const N = 4800;
      const K = 2.0;
      const DENOM = 1.0 - Math.exp(-K);

      const titleEl = document.getElementById('mainTitle');
      const bodyEl = document.getElementById('vocabBody');
      const countEl = document.getElementById('vocabCount');
      const themeToggleBtn = document.getElementById('themeToggle');
      const root = document.documentElement;

      const STORAGE_KEY = 'hindi-vocab-theme';
      const DEFAULT_THEME = 'light';

      function getStoredTheme() {
        try {
          const stored = localStorage.getItem(STORAGE_KEY);
          return stored === 'dark' || stored === 'light' ? stored : null;
        } catch (_) {
          return null;
        }
      }

      function getEffectiveTheme() {
        return root.getAttribute('data-theme') || getStoredTheme() || DEFAULT_THEME;
      }

      function applyTheme(theme) {
        root.setAttribute('data-theme', theme);
        const isDark = theme === 'dark';
        const label = isDark ? 'Switch to light mode' : 'Switch to dark mode';
        themeToggleBtn.setAttribute('aria-pressed', String(isDark));
        themeToggleBtn.setAttribute('aria-label', label);
        themeToggleBtn.setAttribute('title', label);
      }

      // Light by default; honor a previously chosen theme if one is saved
      applyTheme(getStoredTheme() || DEFAULT_THEME);

      themeToggleBtn.addEventListener('click', () => {
        const next = getEffectiveTheme() === 'dark' ? 'light' : 'dark';
        try {
          localStorage.setItem(STORAGE_KEY, next);
        } catch (_) {}
        applyTheme(next);
      });

      function computeFreqRating(rank) {
        if (rank <= 1) return 5.0;
        if (rank >= N) return 1.0;
        const u = (rank - 1) / (N - 1);
        const raw = 1.0 + 4.0 * (1.0 - Math.exp(-K * (1.0 - u))) / DENOM;
        return Math.max(1.0, Math.min(5.0, Math.round(raw * 10) / 10));
      }

      function escapeHtml(value) {
        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      // Keep the column header pinned exactly under the title bar
      function syncTitleHeight() {
        const h = titleEl.parentElement.offsetHeight;
        if (h) root.style.setProperty('--title-h', h + 'px');
      }

      if ('ResizeObserver' in window) {
        new ResizeObserver(syncTitleHeight).observe(titleEl.parentElement);
      } else {
        window.addEventListener('resize', syncTitleHeight);
      }
      syncTitleHeight();

      function renderRows(items) {
        const html = items.map((item) => {
          const rating = computeFreqRating(Number(item.id));
          const pct = ((rating - 1) / 4) * 100;
          return `
            <tr>
              <td class="cell-no">${escapeHtml(item.id)}</td>
              <td class="cell-hi" lang="hi">${escapeHtml(item.hi)}</td>
              <td class="cell-en">${escapeHtml(item.en)}</td>
              <td class="cell-rating">
                <div class="rating">
                  <span class="rating-value">${rating.toFixed(1)}</span>
                  <span class="meter" aria-hidden="true">
                    <span class="meter-fill" style="--v: ${pct.toFixed(1)}%"></span>
                  </span>
                </div>
              </td>
            </tr>`;
        }).join('');

        bodyEl.innerHTML = html;
        countEl.textContent = items.length + (items.length === 1 ? ' word' : ' words');
        syncTitleHeight();
      }

      function renderStatus(message, isError) {
        bodyEl.innerHTML = `
          <tr class="status-msg${isError ? ' is-error' : ''}">
            <td colspan="4">${escapeHtml(message)}</td>
          </tr>`;
      }

      fetch('./vocab.json', { cache: 'no-cache' })
        .then((res) => {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then((data) => {
          if (!Array.isArray(data) || data.length === 0) {
            renderStatus('No vocabulary entries found.', false);
            return;
          }
          renderRows(data);
        })
        .catch((err) => {
          renderStatus('Could not load vocabulary: ' + err.message, true);
        });
    })();
  </script>
</body>
</html>
